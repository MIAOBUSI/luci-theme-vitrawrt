<%
	blank_page = true
-%>

<%+header%>

<div class="vwrt-auth-page">
	<section class="vwrt-auth-card" aria-label="<%:Authorization Required%>">
		<div class="vwrt-auth-brand">
			<img class="vwrt-auth-logo" src="<%=media%>/img/logo.svg" alt="">
			<div>
				<h1 class="vwrt-auth-title">VitraWrt</h1>
				<p class="vwrt-auth-subtitle">璃境 LuCI</p>
				<p class="vwrt-auth-kicker">OpenWrt Management Experience</p>
			</div>
		</div>

		<% if fuser then %>
		<div class="alert-message error">
			<%:Invalid username and/or password! Please try again.%>
		</div>
		<% end %>

		<form method="post" class="cbi-map vwrt-auth-form">
			<div class="cbi-section">
				<div class="cbi-section-node">
					<div class="cbi-value">
						<label class="cbi-value-title" for="luci_username"><%:Username%></label>
						<div class="cbi-value-field">
							<input name="luci_username" id="luci_username" type="text" autocomplete="username" <%=attr("value", duser)%> autofocus>
						</div>
					</div>
					<div class="cbi-value">
						<label class="cbi-value-title" for="luci_password"><%:Password%></label>
						<div class="cbi-value-field">
							<input name="luci_password" id="luci_password" type="password" autocomplete="current-password">
						</div>
					</div>
				</div>
			</div>

			<button class="btn cbi-button-positive important vwrt-auth-submit" type="submit"><%:Log in%></button>
		</form>
	</section>
</div>

<%+footer%>
